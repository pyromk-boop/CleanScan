<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<title>CleanScan</title>
<style>
:root{--ink:#10201A;--mute:#4D5F57;--bg:#FFFFFF;--panel:#F1F5F2;--line:#C9D6CF;--brand:#0B3D2E;--lime:#C8F169;--g:#0F7B3F;--gbg:#DDF4E4;--y:#8A5A00;--ybg:#FFEFC2;--r:#B3261E;--rbg:#FDE0DD;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;padding:12px 16px}
header h1{font-size:22px;margin:0} header h1 span{color:var(--lime)}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;min-height:54px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.icon{min-height:46px;min-width:46px;padding:0;border-color:#fff;background:transparent;color:#fff;font-size:22px}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.scan{width:100%;min-height:175px;border:0;border-radius:20px;background:var(--brand);color:#fff;flex-direction:column;font-size:21px}
.scan small{font-weight:400;font-size:14px;opacity:.85}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;background:#fff}
.card h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:10px}
input,textarea{font:inherit;width:100%;min-height:52px;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
#status{margin-top:14px;padding:14px;border-radius:14px;background:var(--panel);font-weight:600;display:none}
#status.err{background:var(--rbg);color:var(--r)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin-right:8px;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
#preview{width:100%;max-height:200px;object-fit:contain;border-radius:14px;background:var(--panel);margin-top:14px;display:none}
.score{display:flex;align-items:center;gap:16px}
.dial{flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;border:7px solid}
.tone-g{background:var(--gbg);color:var(--g);border-color:var(--g)}
.tone-y{background:var(--ybg);color:var(--y);border-color:var(--y)}
.tone-r{background:var(--rbg);color:var(--r);border-color:var(--r)}
.badge{display:inline-block;background:var(--panel);border:1.5px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:16px}
.banner{border-radius:18px;padding:16px;margin-top:14px;border:3px solid}
.banner h3{margin:0;font-size:20px} .banner p{margin:6px 0 0}
.item{border-left:7px solid;border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--panel)}
.pname{font-size:21px;font-weight:800;margin:8px 0 0}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;max-width:500px;width:100%;padding:20px}
video{width:100%;border-radius:14px;background:#000;max-height:45vh}
</style>
</head>
<body>
<noscript><div style="background:#B3261E;color:#fff;padding:16px;text-align:center;font-weight:bold">JavaScript is turned OFF in your browser! Enable JavaScript in browser settings to use CleanScan.</div></noscript>
<header>
  <h1>Clean<span>Scan</span></h1>
  <button type="button" class="icon" id="gearBtn" aria-label="Settings">⚙</button>
</header>
<main>
  <input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
  <button type="button" class="scan" id="photoBtn">
    <span style="font-size:40px">📷</span>
    Scan ingredient label
    <small>Food, shampoo, sunblock, or household cleaner</small>
  </button>

  <section class="card">
    <h2>Look up by barcode</h2>
    <div class="row">
      <input type="search" id="upc" inputmode="numeric" placeholder="Enter UPC / EAN number">
      <button type="button" class="primary" id="lookupBtn">Look up</button>
    </div>
    <button type="button" style="width:100%;margin-top:10px" id="camScanBtn">Scan barcode with camera</button>
    <p class="hint">Searches Food, Beauty/Personal Care &amp; Household databases + AI lookup.</p>
  </section>

  <section class="card">
    <h2>Or paste ingredient list</h2>
    <textarea id="manualText" placeholder="Paste ingredients or product name (e.g. shampoo, sunscreen, snack)..."></textarea>
    <button type="button" class="primary" style="width:100%;margin-top:10px" id="manualBtn">Analyze Ingredients</button>
  </section>

  <div id="status" role="status"></div>
  <img id="preview" alt="Captured label">
  <div id="results"></div>
</main>

<div id="settingsModal" class="modal-bg">
  <div class="modal-box">
    <h2 style="margin-top:0">Free AI API Key</h2>
    <p class="hint" style="margin-top:0">Stored only on this device. Supports Google AI Studio or OpenRouter.</p>
    <input type="password" id="key" placeholder="Paste API key">
    <div class="row" style="margin-top:14px">
      <button type="button" class="primary" style="flex:1" id="saveKeyBtn">Save</button>
      <button type="button" id="clearKeyBtn">Remove</button>
      <button type="button" id="closeKeyBtn">Close</button>
    </div>
    <p class="hint" id="keyMsg"></p>
  </div>
</div>

<div id="scannerModal" class="modal-bg">
  <div class="modal-box">
    <h2 style="margin-top:0">Point camera at barcode</h2>
    <video id="video" playsinline muted></video>
    <p class="hint" style="text-align:center">Hold barcode steady 6–10 inches away</p>
    <button type="button" style="width:100%;margin-top:12px" id="cancelCamBtn">Cancel</button>
  </div>
</div>

<script>
window.onerror = function(msg, url, line) {
  var el = document.getElementById("status");
  if (el) {
    el.style.display = "block";
    el.className = "err";
    el.textContent = "App Error (Line " + line + "): " + msg;
  }
};

const $ = id => document.getElementById(id);
const K = "cleanscan_api_key";
const getKey = () => { try { return localStorage.getItem(K) || ""; } catch (e) { return ""; } };
const esc = s => String(s ?? "")
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#39;");
const tone = n => n >= 70 ? "g" : n >= 40 ? "y" : "r";

function status(msg, kind) {
  const el = $("status");
  if (!msg) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.className = kind || "";
  el.innerHTML = kind ? esc(msg) : '<span class="spin"></span>' + esc(msg);
}

function openSettingsModal() {
  $("key").value = getKey();
  $("keyMsg").textContent = getKey() ? "Key saved on this device." : "No key saved yet.";
  $("settingsModal").style.display = "flex";
}
function closeSettingsModal() { $("settingsModal").style.display = "none"; }
function saveApiKey() {
  const v = $("key").value.trim();
  if (!v) { $("keyMsg").textContent = "Paste a valid API key first."; return; }
  try { localStorage.setItem(K, v); $("keyMsg").textContent = "Saved!"; } catch (e) { $("keyMsg").textContent = "Storage blocked."; }
}
function clearApiKey() {
  localStorage.removeItem(K);
  $("key").value = "";
  $("keyMsg").textContent = "Removed.";
}

const SYS = "You are a toxicologist, cosmetic chemist, nutritionist, and Canadian health & allergen specialist (Health Canada / CFIA standards). " +
"First, accurately identify the exact product from the label photo, ingredient list, or UPC/EAN barcode—never guess a food item if the barcode or ingredients belong to shampoo, conditioner, sunblock, lotion, makeup, soap, or a household cleaner. " +
"Classify category as one of: Food & Beverage, Personal Care & Hair, Sunblock & Skincare, or Household & Cleaning. " +
"Evaluate health hazards specific to how the product is used: " +
"For Food & Beverage: ultra-processed additives, synthetic dyes, trans fats, excess sodium/sugar, endocrine disruptors, and CFIA gluten/allergen risks. " +
"For Personal Care, Hair, Sunblock & Household items: endocrine/hormone disruptors (parabens, phthalates, oxybenzone, octinoxate, triclosan), formaldehyde releasers (DMDM hydantoin, quaternium-15), harsh sulfates (SLS/SLES), synthetic fragrance/parfum allergens, PFAS, VOCs, and skin/lung irritants. " +
"Return ONLY valid JSON with these exact keys: category, product_name, score (0-100 integer), score_summary, special_alert_title, special_alert_status (SAFE or WARNING or HIGH HAZARD), special_alert_details, flagged_ingredients (list of objects with name, risk, reason), label_fact_check, store_swaps (list of strings), diy_recipe (object with title and steps).";

async function runAnalysis(opts) {
  const text = opts.text || "";
  const imgDataUrl = opts.imgDataUrl || "";
  const apiKey = getKey();

  if (!apiKey) {
    status("Tap the gear icon (⚙) at the top right to add your free AI API key first.", "err");
    openSettingsModal();
    return;
  }

  $("results").innerHTML = "";
  status("Identifying product & analyzing health hazards...");

  try {
    let rawJsonText = "";

    if (apiKey.startsWith("AIza")) {
      const parts = Array.of({ text: text || "Identify this product and analyze all ingredients for health hazards." });
      if (imgDataUrl) {
        const splitData = imgDataUrl.split(",");
